syntax = "proto3";

// Contrato del Customer Service (Hito 2 - RPC).
//
// Responsabilidades: alta, modificacion, baja logica y consulta de clientes,
// y verificacion de existencia y estado activo.
//
// Reglas principales:
// - El documento y el email deben ser unicos.
// - Los clientes inactivos no pueden alquilar.
//
// Errores (codigos gRPC):
//   NOT_FOUND         el cliente no existe.
//   ALREADY_EXISTS    documento o email ya registrados.
//   INVALID_ARGUMENT  datos obligatorios faltantes o invalidos.
//   INTERNAL          error interno del servicio.

package rentar.customer.v1;

option java_multiple_files = true;
option java_package = "com.rentar.customer.grpc";

message Customer {
  int64 id = 1;
  string documento = 2;
  string nombre = 3;
  string apellido = 4;
  string email = 5;
  string telefono = 6;

  // Fecha en formato ISO-8601, ejemplo: "1990-04-12".
  // Vacio si no se informo.
  string fecha_nacimiento = 7;

  bool activo = 8;
}

service CustomerService {

  // Autentica un usuario para que el Gateway pueda crear su sesion.
  // Credenciales invalidas devuelven autenticado = false.
  // Un usuario CLIENTE asociado a un cliente inactivo tampoco puede ingresar.
  rpc AuthenticateUser(AuthenticateUserRequest)
      returns (AuthenticateUserResponse);

  // Lista los clientes registrados.
  // Permite filtrar por identificadores y por clientes activos.
  // Sin filtros, devuelve todos los clientes.
  // INVALID_ARGUMENT si alguno de los IDs es menor o igual a cero.
  rpc ListCustomers(ListCustomersRequest)
      returns (ListCustomersResponse);

  // Consulta un cliente mediante su identificador.
  // INVALID_ARGUMENT si el ID es menor o igual a cero.
  // NOT_FOUND si el cliente no existe.
  rpc GetCustomer(GetCustomerRequest)
      returns (Customer);

  // Registra un nuevo cliente con estado activo.
  // Valida los campos obligatorios y el formato del email y la fecha.
  // INVALID_ARGUMENT si los datos son invalidos.
  // ALREADY_EXISTS si el documento o email ya estan registrados.
  rpc CreateCustomer(CreateCustomerRequest)
      returns (Customer);

  // Actualiza los datos de un cliente existente.
  // Valida el ID, los campos obligatorios y los formatos.
  // Verifica la unicidad del documento y del email.
  // INVALID_ARGUMENT si el ID o los datos son invalidos.
  // NOT_FOUND si el cliente no existe.
  // ALREADY_EXISTS si el documento o email pertenecen a otro cliente.
  rpc UpdateCustomer(UpdateCustomerRequest)
      returns (Customer);

  // Realiza la baja logica de un cliente (activo = false).
  // El registro permanece almacenado en la base de datos.
  // Devuelve los datos del cliente desactivado.
  // INVALID_ARGUMENT si el ID es menor o igual a cero.
  // NOT_FOUND si el cliente no existe.
  rpc DeactivateCustomer(DeactivateCustomerRequest)
      returns (Customer);

  // Verifica la existencia y el estado activo de un cliente.
  // Se utiliza desde el Gateway antes de crear una reserva.
  // Si el cliente no existe, devuelve existe = false y activo = false.
  // INVALID_ARGUMENT si el ID es menor o igual a cero.
  rpc VerifyCustomer(VerifyCustomerRequest)
      returns (VerifyCustomerResponse);
}

// Roles disponibles para el acceso al sistema.
enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_ADMIN = 1;
  USER_ROLE_CLIENTE = 2;
}

message AuthenticateUserRequest {
  string username = 1;
  string password = 2;
}

message AuthenticateUserResponse {
  bool autenticado = 1;
  UserRole rol = 2;
  int64 cliente_id = 3;
  string username = 4;
}

message ListCustomersRequest {

  // Permite filtrar por una lista de identificadores.
  // Una lista vacia no aplica este filtro.
  repeated int64 ids = 1;

  // true: devuelve solamente clientes activos.
  // false o sin informar: devuelve activos e inactivos.
  optional bool solo_activos = 2;
}

message ListCustomersResponse {
  repeated Customer clientes = 1;
}

message GetCustomerRequest {
  int64 id = 1;
}

message CreateCustomerRequest {
  string documento = 1;
  string nombre = 2;
  string apellido = 3;
  string email = 4;
  string telefono = 5;

  // Fecha en formato ISO-8601: YYYY-MM-DD.
  string fecha_nacimiento = 6;
}

message UpdateCustomerRequest {
  int64 id = 1;
  string documento = 2;
  string nombre = 3;
  string apellido = 4;
  string email = 5;
  string telefono = 6;

  // Fecha en formato ISO-8601: YYYY-MM-DD.
  string fecha_nacimiento = 7;
}

message DeactivateCustomerRequest {
  int64 id = 1;
}

message VerifyCustomerRequest {
  int64 id = 1;
}

message VerifyCustomerResponse {
  bool existe = 1;
  bool activo = 2;
}
