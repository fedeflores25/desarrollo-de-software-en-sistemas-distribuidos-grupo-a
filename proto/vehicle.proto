syntax = "proto3";

// Contrato del Vehicle Service (Hito 2 y Hito 3).
//
// Responsabilidades: alta, modificacion, baja logica y consulta de vehiculos,
// consulta de disponibilidad y actualizacion de estado.
//
// Hito 3: incorpora solicitudes de vehiculos externos y la consulta de
// su estado. Las validaciones se realizan de manera asincronica con RabbitMQ.
//
// Errores (codigos gRPC):
//   NOT_FOUND            el vehiculo o la solicitud no existe.
//   ALREADY_EXISTS       la patente ya esta registrada.
//   INVALID_ARGUMENT     datos obligatorios faltantes o invalidos.
//   FAILED_PRECONDITION  operacion no permitida por el estado del vehiculo.
//   INTERNAL             error interno del servicio.

package rentar.vehicle.v1;

option java_multiple_files = true;
option java_package = "com.rentar.vehicle.grpc";

// Tipos de vehiculos admitidos por el sistema.
enum VehicleType {
  VEHICLE_TYPE_UNSPECIFIED = 0;
  VEHICLE_TYPE_SEDAN = 1;
  VEHICLE_TYPE_SUV = 2;
  VEHICLE_TYPE_PICKUP = 3;
  VEHICLE_TYPE_COUPE = 4;
  VEHICLE_TYPE_HATCHBACK = 5;
}

// Estados operativos de los vehiculos.
enum VehicleStatus {
  VEHICLE_STATUS_UNSPECIFIED = 0;
  VEHICLE_STATUS_DISPONIBLE = 1;
  VEHICLE_STATUS_RESERVADO = 2;
  VEHICLE_STATUS_EN_ALQUILER = 3;
}

// Datos de un vehiculo registrado en el sistema.
message Vehicle {
  int64 id = 1;
  string patente = 2;
  string marca = 3;
  string modelo = 4;
  int32 anio = 5;
  string color = 6;
  VehicleType tipo = 7;
  double precio_diario = 8;
  VehicleStatus estado = 9;
  bool activo = 10;
}

service VehicleService {

  // Lista los vehiculos registrados.
  // Permite filtrar por identificadores, estado activo, tipo,
  // marca, modelo y rango de precios.
  // Sin filtros, devuelve todos los vehiculos.
  rpc ListVehicles(ListVehiclesRequest)
      returns (ListVehiclesResponse);

  // Consulta un vehiculo mediante su identificador.
  // NOT_FOUND si el vehiculo no existe.
  rpc GetVehicle(GetVehicleRequest)
      returns (Vehicle);

  // Consulta un vehiculo mediante su patente.
  // INVALID_ARGUMENT si la patente esta vacia.
  // NOT_FOUND si no existe un vehiculo con esa patente.
  rpc GetVehicleByPatente(GetVehicleByPatenteRequest)
      returns (Vehicle);

  // Registra un nuevo vehiculo en el sistema.
  // Valida los datos obligatorios, el tipo y el precio diario.
  // INVALID_ARGUMENT si los datos son invalidos.
  // ALREADY_EXISTS si la patente ya esta registrada.
  rpc CreateVehicle(CreateVehicleRequest)
      returns (Vehicle);

  // Actualiza los datos de un vehiculo existente.
  // Permite modificar marca, modelo, anio, color, tipo y precio diario.
  // La patente no se modifica mediante esta operacion.
  // Valida los campos obligatorios, el tipo y el precio.
  // NOT_FOUND si el vehiculo no existe.
  // INVALID_ARGUMENT si los datos son invalidos.
  rpc UpdateVehicle(UpdateVehicleRequest)
      returns (Vehicle);

  // Realiza la baja logica de un vehiculo.
  // El vehiculo permanece registrado con activo = false.
  // NOT_FOUND si el vehiculo no existe.
  rpc DeactivateVehicle(DeactivateVehicleRequest)
      returns (Vehicle);

  // Modifica el estado operativo de un vehiculo.
  // Se admiten los estados DISPONIBLE, RESERVADO y EN_ALQUILER.
  // INVALID_ARGUMENT si el estado no es valido.
  // NOT_FOUND si el vehiculo no existe.
  // FAILED_PRECONDITION si la operacion no esta permitida.
  rpc UpdateVehicleStatus(UpdateVehicleStatusRequest)
      returns (Vehicle);

  // Consulta los vehiculos disponibles para alquilar.
  // Permite aplicar filtros y excluir identificadores de vehiculos.
  // Devuelve una respuesta exclusiva de esta operacion.
  rpc ListAvailableVehicles(ListAvailableVehiclesRequest)
      returns (ListAvailableVehiclesResponse);

  // Registra una solicitud de incorporacion de un vehiculo externo.
  // Valida los datos obligatorios del cliente y del vehiculo.
  // La solicitud se registra inicialmente como PENDIENTE.
  // Las validaciones de patente y titularidad se realizan
  // de manera asincronica mediante RabbitMQ.
  // INVALID_ARGUMENT si los datos son invalidos.
  rpc CreateExternalVehicleApplication(
      CreateExternalVehicleApplicationRequest)
      returns (ExternalVehicleApplication);

  // Consulta el estado actual de una solicitud externa.
  // Permite conocer los resultados de las validaciones
  // y el identificador del vehiculo si fue incorporado.
  // INVALID_ARGUMENT si el identificador es invalido.
  // NOT_FOUND si la solicitud no existe.
  rpc GetExternalVehicleApplication(
      GetExternalVehicleApplicationRequest)
      returns (ExternalVehicleApplication);
}

// Filtros opcionales para consultar vehiculos.
message VehicleFilter {
  optional VehicleType tipo = 1;
  optional string marca = 2;
  optional string modelo = 3;
  optional double precio_min = 4;
  optional double precio_max = 5;
}

message ListVehiclesRequest {

  // Filtros opcionales de tipo, marca, modelo y precio.
  VehicleFilter filtro = 1;

  // Identificadores que se desean consultar.
  repeated int64 ids = 2;

  // true: devuelve solamente vehiculos activos.
  // false o sin informar: devuelve activos e inactivos.
  optional bool solo_activos = 3;
}

message ListVehiclesResponse {
  repeated Vehicle vehiculos = 1;
}

message GetVehicleRequest {
  int64 id = 1;
}

message GetVehicleByPatenteRequest {
  string patente = 1;
}

message CreateVehicleRequest {
  string patente = 1;
  string marca = 2;
  string modelo = 3;
  int32 anio = 4;
  string color = 5;
  VehicleType tipo = 6;
  double precio_diario = 7;
}

message UpdateVehicleRequest {

  // Identificador del vehiculo que se desea actualizar.
  int64 id = 1;

  string marca = 2;
  string modelo = 3;
  int32 anio = 4;
  string color = 5;
  VehicleType tipo = 6;
  double precio_diario = 7;
}

message DeactivateVehicleRequest {
  int64 id = 1;
}

message UpdateVehicleStatusRequest {
  int64 id = 1;
  VehicleStatus estado = 2;
}

message ListAvailableVehiclesRequest {

  // Filtros opcionales para consultar vehiculos disponibles.
  VehicleFilter filtro = 1;

  // Identificadores de vehiculos que deben excluirse.
  repeated int64 excluir_ids = 2;
}

// Respuesta exclusiva para la consulta de vehiculos disponibles.
message ListAvailableVehiclesResponse {
  repeated Vehicle vehiculos = 1;
}

// -------------------------------------------------------
// HITO 3 - SOLICITUDES DE INCORPORACION EXTERNA
// -------------------------------------------------------

// Datos enviados por el cliente para solicitar la incorporacion.
message CreateExternalVehicleApplicationRequest {
  int64 cliente_id = 1;
  string documento = 2;
  string patente = 3;
  string marca = 4;
  string modelo = 5;
  int32 anio = 6;
  string color = 7;
  VehicleType tipo = 8;
  double precio_diario = 9;
}

// Identificador de una solicitud externa existente.
message GetExternalVehicleApplicationRequest {
  int64 id = 1;
}

// Estado y resultados de una solicitud externa.
//
// estado: PENDIENTE, INCORPORADA o RECHAZADA.
// resultado_patente: VALIDADO, RECHAZADO o vacio.
// resultado_titularidad: VALIDADO, RECHAZADO o vacio.
//
// vehiculo_id solo esta presente cuando se incorporo.
message ExternalVehicleApplication {
  int64 id = 1;
  int64 cliente_id = 2;
  string patente = 3;
  string marca = 4;
  string modelo = 5;
  string estado = 6;
  string resultado_patente = 7;
  string resultado_titularidad = 8;
  optional int64 vehiculo_id = 9;
}
