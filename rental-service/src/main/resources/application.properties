# Nombre del microservicio
spring.application.name=rental-service

# Conexion a MySQL (la base se crea sola si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/rentar_reservas?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

# Esquema y datos iniciales compartidos y versionados en Git
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Puerto del servidor gRPC
rental.grpc.port=9093
